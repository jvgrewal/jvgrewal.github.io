<svg xmlns="http://www.w3.org/2000/svg" width="640" height="410" viewBox="0 0 640 410" role="img" aria-labelledby="title"><title id="title">Moving a computation can execute it when the original program would not</title>
<style>
        :root{color-scheme:light dark;--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}
        @media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#ddd;--muted:#999;--line:#777;--wash:#111}}
        @media print{:root{--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}}
        .bg{fill:var(--bg)} .box{fill:var(--wash);stroke:var(--line);stroke-width:1.2}
        text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--fg);font-size:15px}
        .label{font-size:12px;fill:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
        .edge{fill:none;stroke:var(--fg);stroke-width:1.5;marker-end:url(#arrow)}
        .dash{stroke-dasharray:5 4} .bar{fill:var(--fg)} .pale{fill:var(--wash);stroke:var(--line)}
        </style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="var(--fg)"/></marker></defs>
<rect class="bg" width="640" height="410"/>
<text x="165" y="70" class="" text-anchor="middle">Zero-trip loop</text>
<text x="475" y="70" class="" text-anchor="middle">Update on final iteration</text>
<rect class="box" x="25" y="95" width="280" height="80" rx="3"/>
<text x="165.0" y="119.0" class="mono" text-anchor="middle">j is out of range</text>
<text x="165.0" y="140.0" class="mono" text-anchor="middle">loop executes zero times</text>
<text x="165.0" y="161.0" class="mono" text-anchor="middle">original never reads A[j]</text>
<rect class="box" x="335" y="95" width="280" height="80" rx="3"/>
<text x="475.0" y="119.0" class="mono" text-anchor="middle">last iteration uses valid j</text>
<text x="475.0" y="140.0" class="mono" text-anchor="middle">then stores out-of-range j</text>
<text x="475.0" y="161.0" class="mono" text-anchor="middle">original exits before reload</text>
<path class="edge dash" d="M165 175 V220"/>
<path class="edge dash" d="M475 175 V220"/>
<rect class="box" x="25" y="220" width="280" height="60" rx="3"/>
<text x="165.0" y="244.5" class="" text-anchor="middle">Hoisting adds an early load</text>
<text x="165.0" y="265.5" class="" text-anchor="middle">before the loop condition</text>
<rect class="box" x="335" y="220" width="280" height="60" rx="3"/>
<text x="475.0" y="244.5" class="" text-anchor="middle">Eager repair adds a load</text>
<text x="475.0" y="265.5" class="" text-anchor="middle">after the final store</text>
<rect class="box" x="65" y="325" width="510" height="60" rx="3"/>
<text x="320.0" y="349.5" class="" text-anchor="middle">Extra evaluations must be safe.</text>
<text x="320.0" y="370.5" class="" text-anchor="middle">Every result the original program uses must be preserved.</text></svg>
