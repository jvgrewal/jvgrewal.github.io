<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">Duplicating a small latch separates the frequent and repair paths</title>
<style>
        :root{color-scheme:light dark;--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}
        @media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#ddd;--muted:#999;--line:#777;--wash:#111}}
        @media print{:root{--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}}
        .bg{fill:var(--bg)} .box{fill:var(--wash);stroke:var(--line);stroke-width:1.2}
        text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--fg);font-size:15px}
        .label{font-size:12px;fill:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
        .edge{fill:none;stroke:var(--fg);stroke-width:1.5;marker-end:url(#arrow)}
        .dash{stroke-dasharray:5 4} .bar{fill:var(--fg)} .pale{fill:var(--wash);stroke:var(--line)}
        </style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="var(--fg)"/></marker></defs>
<rect class="bg" width="640" height="480"/>
<text x="155" y="67" class="" text-anchor="middle">Shared latch</text>
<text x="475" y="67" class="" text-anchor="middle">Two latch copies</text>
<rect class="box" x="30" y="105" width="110" height="48" rx="3"/>
<text x="85.0" y="134.0" class="" text-anchor="middle">Frequent</text>
<rect class="box" x="170" y="105" width="110" height="48" rx="3"/>
<text x="225.0" y="134.0" class="" text-anchor="middle">Repair</text>
<rect class="box" x="340" y="105" width="110" height="48" rx="3"/>
<text x="395.0" y="134.0" class="" text-anchor="middle">Frequent</text>
<rect class="box" x="500" y="105" width="110" height="48" rx="3"/>
<text x="555.0" y="134.0" class="" text-anchor="middle">Repair</text>
<rect class="box" x="45" y="220" width="230" height="90" rx="3"/>
<text x="160.0" y="249.0" class="" text-anchor="middle">merge cached values</text>
<text x="160.0" y="270.0" class="" text-anchor="middle">increment i</text>
<text x="160.0" y="291.0" class="" text-anchor="middle">test loop bound</text>
<rect class="box" x="330" y="220" width="130" height="90" rx="3"/>
<text x="395.0" y="259.5" class="" text-anchor="middle">increment i</text>
<text x="395.0" y="280.5" class="" text-anchor="middle">test bound</text>
<rect class="box" x="490" y="220" width="130" height="90" rx="3"/>
<text x="555.0" y="259.5" class="" text-anchor="middle">increment i</text>
<text x="555.0" y="280.5" class="" text-anchor="middle">test bound</text>
<rect class="box" x="45" y="375" width="230" height="50" rx="3"/>
<text x="160.0" y="394.5" class="" text-anchor="middle">Loop header</text>
<text x="160.0" y="415.5" class="" text-anchor="middle">cache PHI</text>
<rect class="box" x="355" y="375" width="240" height="50" rx="3"/>
<text x="475.0" y="394.5" class="" text-anchor="middle">Loop header</text>
<text x="475.0" y="415.5" class="" text-anchor="middle">cache PHI remains</text>
<path class="edge" d="M85 153 V185 H120 V220"/>
<path class="edge dash" d="M225 153 V185 H200 V220"/>
<path class="edge" d="M160 310 V375"/>
<path class="edge" d="M395 153 V220"/>
<path class="edge dash" d="M555 153 V220"/>
<path class="edge" d="M395 310 V375"/>
<path class="edge dash" d="M555 310 V375"/>
<text x="320" y="459" class="label" text-anchor="middle">Exit edges omitted. Each copy has one predecessor; latch PHIs resolve.</text></svg>
