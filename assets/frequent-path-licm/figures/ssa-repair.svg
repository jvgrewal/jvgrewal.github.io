<svg xmlns="http://www.w3.org/2000/svg" width="640" height="590" viewBox="0 0 640 590" role="img" aria-labelledby="title"><title id="title">SSA repair carries the current value around the loop</title>
<style>
        :root{color-scheme:light dark;--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}
        @media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#ddd;--muted:#999;--line:#777;--wash:#111}}
        @media print{:root{--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}}
        .bg{fill:var(--bg)} .box{fill:var(--wash);stroke:var(--line);stroke-width:1.2}
        text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--fg);font-size:15px}
        .label{font-size:12px;fill:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
        .edge{fill:none;stroke:var(--fg);stroke-width:1.5;marker-end:url(#arrow)}
        .dash{stroke-dasharray:5 4} .bar{fill:var(--fg)} .pale{fill:var(--wash);stroke:var(--line)}
        </style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="var(--fg)"/></marker></defs>
<rect class="bg" width="640" height="590"/>
<rect class="box" x="165" y="50" width="310" height="60" rx="3"/>
<text x="320.0" y="74.5" class="mono" text-anchor="middle">Preheader</text>
<text x="320.0" y="95.5" class="mono" text-anchor="middle">init = load j</text>
<rect class="box" x="165" y="150" width="310" height="75" rx="3"/>
<text x="320.0" y="171.5" class="mono" text-anchor="middle">Header</text>
<text x="320.0" y="192.5" class="mono" text-anchor="middle">cur = phi(init, next)</text>
<text x="320.0" y="213.5" class="mono" text-anchor="middle">loop condition</text>
<rect class="box" x="165" y="270" width="310" height="60" rx="3"/>
<text x="320.0" y="294.5" class="mono" text-anchor="middle">Body</text>
<text x="320.0" y="315.5" class="mono" text-anchor="middle">use(cur); test rare update</text>
<rect class="box" x="345" y="375" width="265" height="65" rx="3"/>
<text x="477.5" y="402.0" class="mono" text-anchor="middle">Cold path</text>
<text x="477.5" y="423.0" class="mono" text-anchor="middle">store new_j; repair = load j</text>
<rect class="box" x="165" y="485" width="310" height="60" rx="3"/>
<text x="320.0" y="509.5" class="mono" text-anchor="middle">Latch</text>
<text x="320.0" y="530.5" class="mono" text-anchor="middle">next = phi(cur, repair)</text>
<path class="edge" d="M320 110 V150"/>
<path class="edge" d="M320 225 V270"/>
<path class="edge" d="M165 300 H90 V515 H165"/>
<text x="120" y="360" class="label" text-anchor="middle">keep cur</text>
<path class="edge dash" d="M475 300 H480 V375"/>
<text x="532" y="350" class="label" text-anchor="middle">recompute</text>
<path class="edge dash" d="M478 440 V462 H400 V485"/>
<path class="edge" d="M320 545 V565 H34 V185 H165"/>
<text x="68" y="140" class="label" text-anchor="middle">backedge</text>
<path class="edge" d="M475 188 H580"/>
<text x="580" y="178" class="label" text-anchor="middle">exit</text></svg>
