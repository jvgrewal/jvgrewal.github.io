<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title"><title id="title">The load result belongs to an execution point, not the latest memory contents</title>
<style>
        :root{color-scheme:light dark;--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}
        @media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#ddd;--muted:#999;--line:#777;--wash:#111}}
        @media print{:root{--bg:#fff;--fg:#222;--muted:#666;--line:#999;--wash:#f7f7f7}}
        .bg{fill:var(--bg)} .box{fill:var(--wash);stroke:var(--line);stroke-width:1.2}
        text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:var(--fg);font-size:15px}
        .label{font-size:12px;fill:var(--muted)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
        .edge{fill:none;stroke:var(--fg);stroke-width:1.5;marker-end:url(#arrow)}
        .dash{stroke-dasharray:5 4} .bar{fill:var(--fg)} .pale{fill:var(--wash);stroke:var(--line)}
        </style><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7" fill="var(--fg)"/></marker></defs>
<rect class="bg" width="640" height="320"/>
<text x="125" y="70" class="" text-anchor="middle">Iteration t</text>
<text x="340" y="70" class="" text-anchor="middle">Cold update</text>
<text x="545" y="70" class="" text-anchor="middle">Iteration t + 1</text>
<rect class="box" x="30" y="105" width="185" height="100" rx="3"/>
<text x="122.5" y="139.0" class="mono" text-anchor="middle">j = 5</text>
<text x="122.5" y="160.0" class="mono" text-anchor="middle">snapshot = load j</text>
<text x="122.5" y="181.0" class="mono" text-anchor="middle">snapshot = 5</text>
<rect class="box" x="245" y="105" width="190" height="100" rx="3"/>
<text x="340.0" y="139.0" class="mono" text-anchor="middle">store 9 to j</text>
<text x="340.0" y="160.0" class="mono" text-anchor="middle">repair = load j</text>
<text x="340.0" y="181.0" class="mono" text-anchor="middle">repair = 9</text>
<rect class="box" x="465" y="105" width="155" height="100" rx="3"/>
<text x="542.5" y="149.5" class="mono" text-anchor="middle">snapshot = 9</text>
<text x="542.5" y="170.5" class="mono" text-anchor="middle">use(9)</text>
<path class="edge" d="M215 155 H245"/>
<path class="edge" d="M435 155 H465"/>
<text x="320" y="248" class="" text-anchor="middle">If use(snapshot) occurs after the cold store in iteration t,</text>
<text x="320" y="273" class="" text-anchor="middle">it still uses 5. The repaired 9 is for a later load execution.</text></svg>
