<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Game of Life glider</title>
  <style>
    .background { fill: #fff; }
    .cells { fill: #222; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #000; }
      .cells { fill: #ddd; }
    }
  </style>
  <rect class="background" width="32" height="32"/>
  <g class="cells">
    <rect x="13" y="5" width="6" height="6"/>
    <rect x="21" y="13" width="6" height="6"/>
    <rect x="5" y="21" width="6" height="6"/>
    <rect x="13" y="21" width="6" height="6"/>
    <rect x="21" y="21" width="6" height="6"/>
  </g>
</svg>
