<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  {% seo title=false %}
  {% feed_meta %}
  <link id="site-favicon" rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}?v=glider-centered" type="image/svg+xml">
  <script src="{{ '/assets/js/favicon.js' | relative_url }}?v=centered" defer></script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=mobile-life-bottom">
  {% if page.body_class == 'home' %}
  <script src="{{ '/assets/js/home-life.js' | relative_url }}?v=mobile-bottom" defer></script>
  {% endif %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
  <header>
    <a class="title" href="{{ '/' | relative_url }}"><h1>{{ site.title }}</h1></a>
    <nav aria-label="Main navigation">
      <p>
        <a href="{{ '/' | relative_url }}"{% if page.body_class == 'home' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.body_class == 'blog' or page.layout == 'post' %} aria-current="page"{% endif %}>Writing</a>
      </p>
    </nav>
  </header>
  <main>{{ content }}</main>
  {% if page.body_class == 'home' %}
  <canvas id="life-margins" class="life-margins" aria-hidden="true"></canvas>
  {% endif %}
</body>
</html>
